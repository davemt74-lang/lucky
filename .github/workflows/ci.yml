          php tests/v5q29e4a_timeline_db.php
          php tests/v5q29e4b_export_db.php
          php tests/v5q29e4c_profiles_db.php
          php tests/v5q29e4d1_phone_camera_default_db.php
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          pip install playwright
          # The GitHub Ubuntu image already includes Chromium's shared libraries.
          # Avoid reinstalling dozens of apt packages through a slow mirror.
          python -m playwright install chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux64*' | head -1)
          test -x "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Prepare local artifact folder
        run: sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data
