name: Lucky Game Hub CI
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, fileinfo, mbstring, zip, curl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: for f in public/*.js tests/*.js; do node --check "$f"; done
      - name: PHP and browser-independent tests
        run: |
          php tests/engine.php
          php tests/v5q22_phone_controller_contract.php
          php tests/v5q22b_game_catalog.php
          php tests/v5q22c_cloud_updates.php
          php tests/v5q22e_game_packages.php
          php tests/v5q22f_cloud_download.php
          php tests/v5q22g_activation.php
          php tests/v5q22h_phone_bridge.php
          php tests/v5q23a_activation_recovery.php
          php tests/v5q23a_phone_version.php
          php tests/v5q23b_offline_media.php
          php tests/v5q23c_publisher_channels.php
          php tests/v5q24_plugin_permissions.php
          node tests/v5q24_sdk_contract.js
          node tests/v5q23b_sdk.js
          node tests/v5q29a_timeline.js
          node tests/v5q29c_cue_tools.js
          python3 tests/v5q23b_game_sdk.py
          php tests/v5q16_session_lifecycle.php
          php tests/v5q18_foundation.php
          php tests/spin_reveal.php
          php tests/montage_claim_timeline.php
          php tests/proof_handoff.php
          php tests/prize_presentation.php
          php tests/account_ui.php
          php tests/catalog.php
          php tests/pairing.php
          php tests/v5q15c_upgrade_readiness.php
          php tests/migration_sql.php
          php tests/proof_config.php
          php tests/montage.php
          php tests/timeline_audio.php
          php tests/timeline_visuals.php
          php tests/timeline_layers.php
          php tests/timeline_templates.php
          php tests/auto_draft.php
          php tests/proof_revisions.php
          node tests/proof_plan.js
          php tests/v5q25_session_contract.php
          php tests/v5q25_prize_smart_tags.php
          php tests/v5q26_movie_preview_contract.php
          php tests/v5q26c_splash_contract.php
          php tests/v5q28a_video_ai_contract.php
          php tests/v5q29c_ai_skills.php
          php tests/v5q29b_media_intelligence.php
          php tests/v5q28b_phone_capture_contract.php
          php tests/v5q29e1_recording_sessions_contract.php
          php tests/v5q29e2_phone_camera_contract.php
          php tests/v5q29e3_multicamera_contract.php
          php tests/v5q29e4a_timeline_contract.php
          php tests/v5q29e4b_export_plan.php
          php tests/v5q29e4c_profiles_contract.php
          php tests/v5q29e4d1_studio_contract.php
