          timeout 90s python tests/v5p_button_sync.py
  video-encode:
    # Pinned LTS runner avoids slow-moving rolling-image multimedia mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -hide_banner -version | head -1
          else
            # Azure's package mirror can take longer than the entire job
            # timeout. Use Ubuntu's canonical archive for this CI-only tool.
            # Runner images have multiple APT source formats. The old
            # single-file replacement left Azure mirrors active and exhausted
            # the 20-minute encode job timeout during dependency downloads.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [[ -f "$source" ]] || continue
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            done
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: FFmpeg smoke encode
        run: |
          ffmpeg -hide_banner -v error -y -f lavfi -i color=c=blue:s=320x180:r=30 -f lavfi -i anullsrc -t 1 -c:v libx264 -c:a aac -shortest /tmp/lucky-smoke.mp4
          ffprobe -hide_banner -v error /tmp/lucky-smoke.mp4
          php tests/timeline_audio_render.php
          php tests/timeline_visual_render.php
          php tests/timeline_layers_render.php
          php tests/montage.php
          php tests/auto_draft.php
          php tests/v5q29b_media_ffmpeg.php
          php tests/v5q29e4b_export_ffmpeg.php
