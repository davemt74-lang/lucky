name: Lucky Game Hub CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, fileinfo, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: for f in public/*.js tests/*.js; do node --check "$f"; done
      - name: PHP and browser-independent tests
        run: |
          php tests/engine.php
          php tests/spin_reveal.php
          php tests/catalog.php
          php tests/pairing.php
          php tests/v5q15c_upgrade_readiness.php
          php tests/migration_sql.php
          php tests/proof_config.php
          php tests/montage.php
          php tests/auto_draft.php
          php tests/proof_revisions.php
          node tests/proof_plan.js
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux64*' | head -1)
          test -x "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Prepare local artifact folder
        run: sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data
      - name: Proof capture and timeline regressions
        run: |
          python tests/proof_admin_browser.py
          python tests/proof_browser.py
          python tests/v5q3_editor_browser.py
          python tests/v5q5_postgame_browser.py
          python tests/v5q6_proof_browser.py
          python tests/v5q7_workspace_browser.py
          python tests/v5q8_studio_browser.py
          python tests/v5q8b_claim_camera_return_browser.py
          python tests/v5q9_fullwidth_browser.py
          python tests/v5q10_navigation_browser.py
          python tests/v5q12_claim_camera_flow.py
          python tests/v5q13_camera_review_browser.py
          python tests/v5q13_phone_proof_browser.py
          python tests/v5q14_single_proof_flow.py
          python tests/v5q15b_prize_acceptance_browser.py
          python tests/v5q14b_live_phone_handoff.py
          python tests/v5q15c_phone_reconnect_browser.py
          python tests/v5q15e_wheel_reveal_browser.py
      - name: Phone controller regressions
        run: |
          python tests/v5p2_navigation_voice.py
          python tests/v5p_sync.py
          timeout 90s python tests/v5p_button_sync.py
  video-encode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: FFmpeg smoke encode
        run: |
          ffmpeg -hide_banner -v error -y -f lavfi -i color=c=blue:s=320x180:r=30 -f lavfi -i anullsrc -t 1 -c:v libx264 -c:a aac -shortest /tmp/lucky-smoke.mp4
          ffprobe -hide_banner -v error /tmp/lucky-smoke.mp4
          php tests/montage.php
          php tests/auto_draft.php
