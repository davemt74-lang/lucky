name: Lucky Game Hub CI
concurrency:
  group: lucky-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, fileinfo, mbstring, zip, curl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify every executable test is registered exactly once
        run: python3 tools/test_inventory.py --check
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: for f in public/*.js sdk/*.js tests/*.js; do node --check "$f"; done
      - name: Core behavioral and contract suites
        run: python3 tools/test_inventory.py --group core
  prize-packages-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: luckytestpassword
          MARIADB_DATABASE: lucky_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,fileinfo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real MariaDB regression suites
        run: python3 tools/test_inventory.py --group database
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, fileinfo, mbstring, zip, curl
      - name: Install Chromium and Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux64*' | head -1)
          test -x "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Prepare isolated CI screenshot folder
        run: sudo mkdir -p /mnt/data && sudo chown "$USER" /mnt/data
      - name: Browser, phone, camera and editor regression suites
        run: python3 tools/test_inventory.py --group browsers
  video-encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg when absent from runner
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -hide_banner -version | head -1
          else
            # Use Ubuntu's canonical archive if a runner mirror is slow.
            for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [[ -f "$source" ]] || continue
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            done
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: FFmpeg smoke encode
        run: |
          ffmpeg -hide_banner -v error -y -f lavfi -i color=c=blue:s=320x180:r=30 -f lavfi -i anullsrc -t 1 -c:v libx264 -c:a aac -shortest /tmp/lucky-smoke.mp4
          ffprobe -hide_banner -v error /tmp/lucky-smoke.mp4
      - name: Real media rendering and export parity suites
        run: python3 tools/test_inventory.py --group video
