name: Full Deployment ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lucky-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  certify:
    name: Certify exact merged source
    if: github.repository == 'davemt74-lang/lucky' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  windows-certify:
    name: Certify Windows from the same source
    if: github.repository == 'davemt74-lang/lucky' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-homeserver.yml
  package:
    name: Build verified one-extract deployment ZIP
    needs: [certify, windows-certify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read authoritative release filenames
        id: release
        run: |
          python3 -c 'import json; from tools.release import names; print("\n".join(f"{key}={value}" for key,value in names(json.load(open("release.json"))).items()))' >> "$GITHUB_OUTPUT"
      - name: Package the exact certified commit
        run: python3 tools/release.py build --output-dir dist --commit "$GITHUB_SHA"
      - name: Independently verify root layout, provenance and checksums
        run: python3 tools/release.py verify --output-dir dist --commit "$GITHUB_SHA"
      - name: Retain the verified release payload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: |
            dist/${{ steps.release.outputs.deploy }}
            dist/${{ steps.release.outputs.sdk }}
            dist/BUILD_INFO.json
            dist/BUILD_INFO.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  direct-release:
    name: Direct HostGator deployment ZIP
    needs: package
    if: github.repository == 'davemt74-lang/lucky' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unwrap the certified workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: release
      - name: Verify and publish immutable direct-download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_release.py --output-dir release
