name: Full Deployment ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build complete PHP/MySQL deployment package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/work
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|tests/*) continue ;;
            esac
            mkdir -p "dist/work/$(dirname "$file")"
            cp -- "$file" "dist/work/$file"
          done < <(git ls-files -z)
          for required in install.php upgrade.php proof.php controller.php camera.php recording-editor.php director.php game.php live-view.php api/index.php api/director-live.php api/phone-media.php api/recording-sessions.php api/recording-phone.php api/recording-media.php api/recording-timeline.php api/recording-export.php lib/RecordingSessions.php lib/RecordingPhone.php lib/RecordingMulticam.php lib/RecordingProfiles.php lib/RecordingTimeline.php lib/RecordingExports.php lib/RecordingExportPlan.php lib/MulticameraEncoder.php lib/RecordingExportWorker.php lib/PartyStudio.php lib/CostumeGameplay.php lib/LiveGameDirector.php lib/DirectorBroadcast.php lib/DirectorTurn.php bin/recording-export-worker.php lib/migrations/v5q29e1_recording_sessions.sql lib/migrations/v5q29e2_phone_camera.sql lib/migrations/v5q29e3_multicamera_coordination.sql lib/migrations/v5q29e4a_multicamera_timeline.sql lib/migrations/v5q29e4b_multicamera_exports.sql lib/migrations/v5q29e4c_recording_profiles.sql lib/migrations/v5q30_party_studio.sql lib/migrations/v5q31_costume_actions.sql lib/migrations/v5q32e1_permanent_show_url.sql public/director-workspace.js public/director-game.js public/director-game.css public/director-publish.js public/director-view.js public/display-program.js public/display-program.css public/recording-editor.js public/recording-editor.css public/phone-controller.js public/phone-capture.js public/recording-camera.js public/admin-recordings.js public/proof.js public/party-studio.js public/party-studio.css public/costume-gameplay.js public/costume-gameplay.css public/editor-moments.js public/editor-moments.css public/game-setup.js public/game-setup.css storage/.htaccess; do
            if [[ ! -f "dist/work/$required" ]]; then
              echo "Required deployment file missing: $required"
              exit 1
            fi
          done
          (cd dist/work && zip -qr ../Lucky_Game_Hub_V5Q32F1_Full_Deploy.zip .)
          unzip -t dist/Lucky_Game_Hub_V5Q32F1_Full_Deploy.zip | tail -n 1
          # HostGator one-upload/one-extract contract: app files must be ZIP-root entries.
          for required_root in index.php admin.php director.php api/director-live.php public/director-view.js; do
            if ! unzip -p dist/Lucky_Game_Hub_V5Q32F1_Full_Deploy.zip "$required_root" >/dev/null; then
              echo "Deployment ZIP is missing root-level $required_root"
              exit 1
            fi
          done
          (cd dist && sha256sum Lucky_Game_Hub_V5Q32F1_Full_Deploy.zip > SHA256SUMS.txt)
          # Developer toolkit is independently downloadable; it does not
          # include a playable second consumer game or signing secrets.
          zip -q dist/Lucky_Game_SDK_V5Q24.zip \
            sdk/lucky-game.js tools/game_sdk.py \
            docs/GAME_PACKAGE_SDK.md docs/GAME_PACKAGE_FORMAT.md docs/PACKAGE_PHONE_CONTROLLERS.md docs/V5Q24_UNIVERSAL_PLUGIN_SDK.md
          unzip -t dist/Lucky_Game_SDK_V5Q24.zip | tail -n 1
          (cd dist && sha256sum Lucky_Game_SDK_V5Q24.zip >> SHA256SUMS.txt)
          {
            echo "Lucky Game Hub V5Q32F1 — Full Deployment"
            echo "Source: davemt74-lang/lucky"
            echo "Branch: main"
            echo "Commit: $GITHUB_SHA"
            echo "Files: $(find dist/work -type f | wc -l)"
            echo "Contents: PHP/MySQL app, public assets, installer, upgrade migrations, docs."
            echo "Excluded: GitHub automation and development tests."
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt
      - name: Upload verified deployment ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: lucky-v5q32f1-complete-deployment
          path: |
            dist/Lucky_Game_Hub_V5Q32F1_Full_Deploy.zip
            dist/Lucky_Game_SDK_V5Q24.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
  direct-release:
    name: Direct HostGator deployment ZIP
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified deployment payload
        uses: actions/download-artifact@v4
        with:
          name: lucky-v5q32f1-complete-deployment
          path: release
      - name: Publish a one-extract GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_zip=$(find release -maxdepth 1 -type f -name 'Lucky_Game_Hub_V*_Full_Deploy.zip' -print -quit)
          test -n "$deploy_zip" && test -f "$deploy_zip"
          filename=${deploy_zip##*/}
          version=${filename#Lucky_Game_Hub_}
          version=${version%_Full_Deploy.zip}
          [[ "$version" =~ ^V[0-9A-Za-z]+$ ]] || { echo 'Invalid deployment version'; exit 1; }
          tag=$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')
          unzip -t "$deploy_zip" | tail -n 1
          for required_root in index.php admin.php director.php api/director-live.php public/director-view.js; do
            unzip -p "$deploy_zip" "$required_root" >/dev/null || { echo "Missing root entry $required_root"; exit 1; }
          done
          # One immutable, versioned release asset per certified deployment version.
          # A rerun with an existing tag leaves the published ZIP unchanged.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already published; leaving its download untouched."
          else
            gh release create "$tag" "$deploy_zip" release/SHA256SUMS.txt release/BUILD_INFO.txt \
              --target "$GITHUB_SHA" --title "Lucky Game Hub $version — Direct Deploy ZIP" \
              --notes 'Download the Full_Deploy.zip directly, upload it to the existing HostGator installation directory, and extract once. No outer GitHub artifact ZIP or extra folder. Preserve existing storage/config.php, user uploads, and database data.'
          fi
          echo "Direct ZIP: https://github.com/$GH_REPO/releases/download/$tag/$filename"
