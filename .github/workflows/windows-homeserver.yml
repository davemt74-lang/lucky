name: Windows Offline HomeServer EXE
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homeserver-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile self-contained Windows installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & .\homeserver\build-windows.ps1 -OutputDir $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){exit 1}
      - name: Verify installer SHA-256 and embedded runtimes
        shell: pwsh
        run: |
          $release=Join-Path $env:RUNNER_TEMP 'lucky-homeserver-output'
          $exe=Join-Path $release 'Lucky_Game_Hub_HomeServer_V5Q29E2_Setup.exe'
          if(!(Test-Path $exe)){throw 'EXE missing'}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content (Join-Path $release 'SHA256SUMS.txt') -Raw).Split(' ')[0].Trim()
          if($hash -ne $expected){throw 'Installer digest failed'}
          $manifest=Get-Content (Join-Path $release 'RUNTIME_MANIFEST.json') -Raw |ConvertFrom-Json
          if(!$manifest.phpVersion -or !$manifest.mariadbVersion -or !$manifest.ffmpegBuild){throw 'Runtime manifest missing components'}
          Write-Host "EXE_SHA256=$hash"
      - name: Perform clean per-user installation, local database and HTTP smoke
        shell: pwsh
        run: |
          $release=Join-Path $env:RUNNER_TEMP 'lucky-homeserver-output'
          $exe=Join-Path $release 'Lucky_Game_Hub_HomeServer_V5Q29E2_Setup.exe'
          $installation=Join-Path $env:RUNNER_TEMP 'LuckyHomeServerInstalled'
          $proc=Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""',"/DIR=$installation") -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "EXE installation failed: $($proc.ExitCode)"}
          $start=Join-Path $installation 'homeserver\start.ps1'
          if(!(Test-Path $start)){throw 'Installer did not extract launcher'}
          # Cloud ZIP and Windows EXE originate from identical tracked application sources.
          $application=Join-Path $installation 'app'
          $source=(Get-Location).Path
          $count=0
          foreach($file in (& git ls-files)){
            if($file -match '^(tests/|\.github/|dist/|\.git/|homeserver/installer\.iss$)'){continue}
            $from=Join-Path $source $file
            $to=Join-Path $application $file
            if(!(Test-Path $to)){throw "HomeServer missing application file: $file"}
            if((Get-FileHash $from -Algorithm SHA256).Hash -ne (Get-FileHash $to -Algorithm SHA256).Hash){
              throw "HomeServer application differs from Cloud source: $file"
            }
            $count++
          }
          Write-Host "CLOUD_HOMESERVER_APPLICATION_PARITY_PASS ($count files)"
          try {
            $out=& $start -Smoke -NoBrowser 2>&1 | Out-String
            Write-Host $out
            if($out -notmatch 'HOMESERVER_SMOKE_OK'){throw 'Local MariaDB/PHP/Caddy smoke failed'}
          } catch {
            Write-Host ('SMOKE ERROR: '+$_.Exception.Message)
            $logDir=Join-Path $env:LOCALAPPDATA 'LuckyGameHub\logs'
            if(Test-Path $logDir){
              Get-ChildItem $logDir -File |ForEach-Object {
                Write-Host ('=== '+$_.Name+' ===')
                Get-Content -LiteralPath $_.FullName -Tail 65 |Write-Host
              }
            }
            Get-NetTCPConnection -LocalPort 8833,9017,3307 -ErrorAction SilentlyContinue |Select-Object LocalAddress,LocalPort,State |Format-Table |Out-String |Write-Host
            throw
          }
          $data=Join-Path $env:LOCALAPPDATA 'LuckyGameHub'
          if(!(Test-Path (Join-Path $data 'db\mysql'))){throw 'User-owned database data missing'}
          $config=Join-Path $data 'storage\config.php'
          if(!(Test-Path $config)){throw 'Local game configuration missing'}
          $raw=Get-Content $config -Raw
          if($raw -notmatch "'deployment' => 'homeserver'" -or $raw -notmatch "'db_host' => '127.0.0.1'"){throw 'Database is not loopback-only'}
          if(!(Test-Path (Join-Path $data 'caddy-data'))){throw 'Internal LAN certificate state missing'}
          # All mutable data survives another startup; no first-run reinit.
          try {
            $out=& $start -Smoke -NoBrowser 2>&1 | Out-String
            Write-Host $out
            if($out -notmatch 'HOMESERVER_SMOKE_OK'){throw 'HomeServer did not recover after restart'}
          } catch {
            Write-Host ('RESTART ERROR: '+$_.Exception.Message)
            $logDir=Join-Path $env:LOCALAPPDATA 'LuckyGameHub\logs'
            if(Test-Path $logDir){
              Get-ChildItem $logDir -File |ForEach-Object {
                Write-Host ('=== '+$_.Name+' ===')
                Get-Content -LiteralPath $_.FullName -Tail 65 |Write-Host
              }
            }
            Get-NetTCPConnection -LocalPort 8833,9017,3307 -ErrorAction SilentlyContinue |Select-Object LocalAddress,LocalPort,State |Format-Table |Out-String |Write-Host
            throw
          }
          Write-Host 'WINDOWS_OFFLINE_INSTALL_AND_RESTART_PASS'
      - name: Certify installed Windows ZIP packages and isolated recovery
        shell: pwsh
        run: |
          $installation=Join-Path $env:RUNNER_TEMP 'LuckyHomeServerInstalled'
          $php=Join-Path $installation 'runtime\php\php.exe'
          $ini=Join-Path $env:LOCALAPPDATA 'LuckyGameHub\php.ini'
          $test=Join-Path $installation 'app\tests\v5q23a_activation_recovery.php'
          $sourceTest=Join-Path (Get-Location).Path 'tests\v5q23a_activation_recovery.php'
          if(!(Test-Path $php) -or !(Test-Path $ini) -or !(Test-Path $sourceTest)){throw 'Installed certification runtime incomplete'}
          # Tests are deliberately excluded from the product installer. Copy
          # this fixture into the temporary CI installation only, after the
          # application source-parity and clean-install checks have passed.
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $test) | Out-Null
          Copy-Item -LiteralPath $sourceTest -Destination $test -Force
          & $php -c $ini $test
          if($LASTEXITCODE -ne 0){throw 'Installed game recovery certification failed'}
          Write-Host 'WINDOWS_GAME_RECOVERY_CERTIFIED'
          # The same multicamera FFmpeg graph must run against the bundled
          # Windows PHP and FFmpeg binaries, not only Linux CI.
          $exportSource=Join-Path (Get-Location).Path 'tests\v5q29e4b_export_ffmpeg.php'
          $exportTest=Join-Path $installation 'app\tests\v5q29e4b_export_ffmpeg.php'
          if(!(Test-Path $exportSource)){throw 'Multicamera encoder test missing'}
          Copy-Item -LiteralPath $exportSource -Destination $exportTest -Force
          $env:PATH=(Join-Path $installation 'runtime\ffmpeg\bin')+';'+$env:PATH
          & $php -c $ini $exportTest
          if($LASTEXITCODE -ne 0){throw 'Bundled Windows multicamera FFmpeg render failed'}
          Write-Host 'WINDOWS_MULTICAMERA_MP4_CERTIFIED'
      - name: Upload Windows installer and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: Lucky_Game_Hub_HomeServer_V5Q29E2_Windows_Preview
          path: |
            ${{ runner.temp }}/lucky-homeserver-output/Lucky_Game_Hub_HomeServer_V5Q29E2_Setup.exe
            ${{ runner.temp }}/lucky-homeserver-output/SHA256SUMS.txt
            ${{ runner.temp }}/lucky-homeserver-output/RUNTIME_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
